# gcovr reads this from the repository root: `gcovr` alone reports build-cov.
# Ours only: the FFC-generated element headers are not (their .ufl sources are),
# and the tests are what measures, not what is measured.
root = .
search-path = build-cov
filter = src/
filter = apps/
exclude = src/interpol/dolfin_elements/.*\.h
exclude-throw-branches = yes
exclude-unreachable-branches = yes
merge-mode-functions = merge-use-line-min
